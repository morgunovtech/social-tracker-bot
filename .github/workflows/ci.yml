name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # the Dependabot auto-merge starts the main run (see dependabot-automerge.yml)

jobs:
  test:
    name: lint · test · audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The dev tools first, then exactly what the image gets (hashes checked,
      # nothing else resolved): the tests run on the image's versions, and
      # pip check says if a dev tool disagrees with them.
      - run: |
          pip install -r requirements-dev.txt
          pip install --require-hashes --no-deps -r requirements.txt
          pip check
      - run: ruff check .
      - run: pytest -q
      # Known vulnerabilities in the pinned dependencies fail the build:
      # the fix is a version bump (Dependabot opens it).
      - run: pip-audit -r requirements.txt --strict --progress-spinner off
      - run: pip-audit -r requirements-dev.txt --strict --progress-spinner off   # the CI tools too
      # The production image, on the leg whose Python the image ships (3.15):
      # tests pass on the runner's Python, but a base image bump or a package
      # without wheels for it only breaks here.
      - if: matrix.python == '3.15'
        run: docker build --quiet --tag social-tracker-bot-ci .
      # The entrypoint must hand a root-owned volume to appuser and drop root,
      # as on Railway: otherwise the bot can't write its DB. The report time
      # zone needs the tz database in the image.
      - if: matrix.python == '3.15'
        run: |
          sudo mkdir -p /tmp/rootdata
          docker run --rm -v /tmp/rootdata:/app/data social-tracker-bot-ci \
            python -c "import os, bot.main; from bot.config import normalize_tz; \
              assert os.getuid() == 1000 and os.access('data', os.W_OK) and normalize_tz('Europe/Moscow')"
      - if: matrix.python == '3.15' && github.event_name == 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - if: matrix.python == '3.15' && github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - if: matrix.python == '3.15' && github.event_name == 'pull_request'
        name: arm64 builds too (before the merge, not after)
        run: docker buildx build --platform linux/arm64 .

  mail-worker:
    name: mail-worker · test · audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mail-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mail-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev

  # The image on ghcr.io — for running the bot on any machine with Docker
  # without cloning or building: every green main publishes :latest and
  # :sha-<commit> for amd64 and arm64. Nobody publishes by hand. A human merge
  # pushes to main and starts this run; the Dependabot auto-merge pushes with
  # GITHUB_TOKEN, which starts no workflow, so that workflow dispatches this
  # one itself. A package published from a public repository with
  # GITHUB_TOKEN is public like the repository.
  image:
    name: publish image (ghcr.io)
    needs: [test, mail-worker]
    if: >-
      github.repository == 'morgunovtech/social-tracker-bot' && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-image
      cancel-in-progress: false   # never cancel a publish; :latest goes only to the newest main below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # :latest only when this commit is still the tip of main: a queued or
      # re-run older run publishes its :sha-… tag but never moves :latest back.
      - id: head
        run: echo "newest=$([ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ steps.head.outputs.newest }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # «🔄 Бот обновился» and the build line in ⚙️ Settings read it.
          build-args: APP_COMMIT=${{ github.sha }}
