name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint · test · audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # Known vulnerabilities in the pinned dependencies fail the build:
      # the fix is a version bump (Dependabot opens it).
      - run: pip-audit -r requirements.txt --strict --progress-spinner off
      # The production image: tests pass on the runner's Python, but a base
      # image bump or a package without wheels for it only breaks here.
      - if: matrix.python == '3.14'
        run: docker build --quiet --tag social-tracker-bot-ci .
      # The entrypoint must hand a root-owned volume to appuser and drop root,
      # as on Railway: otherwise the bot can't write its DB. The report time
      # zone needs the tz database in the image.
      - if: matrix.python == '3.14'
        run: |
          sudo mkdir -p /tmp/rootdata
          docker run --rm -v /tmp/rootdata:/app/data social-tracker-bot-ci \
            python -c "import os, bot.main; from bot.config import normalize_tz; \
              assert os.getuid() == 1000 and os.access('data', os.W_OK) and normalize_tz('Europe/Moscow')"

  mail-worker:
    name: mail-worker · test · audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mail-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mail-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
