# The "New issue" page: bugs go through the form, questions and ideas to
# Discussions, vulnerabilities to a private advisory (see SECURITY.md).
blank_issues_enabled: false
contact_links:
  - name: Question or setup help
    url: https://github.com/morgunovtech/social-tracker-bot/discussions/new?category=q-a
    about: Tokens, Railway, Docker, the LinkedIn cookie — anything that isn't a bug. Ask in Discussions → Q&A.
  - name: Idea or feature request
    url: https://github.com/morgunovtech/social-tracker-bot/discussions/new?category=ideas
    about: Propose it in Discussions → Ideas.
  - name: Security vulnerability
    url: https://github.com/morgunovtech/social-tracker-bot/security/advisories/new
    about: Report it privately, not in a public issue.
