name = "socialbot-mail"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Mail waiting for the bot. Create it with:
#   npx wrangler kv namespace create EVENTS
# and paste the printed id here.
[[kv_namespaces]]
binding = "EVENTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Required: the mailbox(es) that forward here, comma-separated (e.g. your
# Gmail address). Mail from anyone else is rejected; empty rejects all.
ALLOWED_SENDERS = ""

# The bot's bearer token is a secret, not a var:
#   npx wrangler secret put TOKEN
