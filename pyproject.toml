[project]
name = "social-tracker-bot"
version = "1.11.0"
description = "Self-hosted Telegram bot that watches your social accounts: followers on Telegram, YouTube, Instagram and LinkedIn, your channel's joins, posts and reactions, plus hijack, comment and security-email alerts and a weekly reputation report on how people and AI assistants find you"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".claude", "data", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
